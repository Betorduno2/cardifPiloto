<div class="container fade-in">
  <!-- Barra de progreso -->
  <div class="progress-bar">
    <div class="progress-fill" [style.width.%]="progress"></div>
  </div>
  
  <!-- Contenido principal -->
  <div class="card">
    <h1>{{ getTitle() }}</h1>
    <p class="mb-lg">{{ getDescription() }}</p>
    
    <!-- Información del proyecto actual -->
    <div class="mb-lg" *ngIf="currentProject">
      <p class="text-primary">Proyecto: {{ currentProject?.name }}</p>
    </div>
    
    <!-- Formulario específico del componente -->
    <div class="mb-lg">
      <label for="userInput" class="mb-sm">Ingresa tu información:</label>
      <input 
        id="userInput"
        type="text" 
        [(ngModel)]="userInput"
        (input)="onInputChange($event)"
        placeholder="Mínimo 4 caracteres"
        class="form-input"
      />
      <div *ngIf="userInput && !isValid" class="text-error mt-sm">
        El valor debe tener al menos 4 caracteres
      </div>
    </div>
  </div>
  
  <!-- Navegación -->
  <div class="flow-navigation">
    <button 
      *ngIf="!isFirstStep" 
      class="btn btn-outline"
      (click)="goToPreviousStep()">
      {{ getPreviousButtonText() }}
    </button>
    
    <div *ngIf="isFirstStep"></div>
    
    <div class="navigation-right">
      <button 
        class="btn btn-secondary me-sm"
        (click)="resetForm()">
        Limpiar
      </button>
      <button 
        class="btn btn-primary"
        (click)="handleNextClick()"
        [disabled]="!isValid">
        {{ getButtonText() }}
      </button>
    </div>
  </div>
</div>
