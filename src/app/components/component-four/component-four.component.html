<div class="container fade-in">
  <!-- Barra de progreso -->
  <div class="progress-bar">
    <div class="progress-fill" [style.width.%]="progress"></div>
  </div>
  
  <!-- Contenido principal -->
  <div class="card">
    <h1>{{ getTitle() }}</h1>
    <p class="mb-lg">{{ getDescription() }}</p>
    
    <!-- Información del proyecto actual -->
    <div class="mb-lg" *ngIf="currentProject">
      <p class="text-primary">Proyecto: {{ currentProject.name }}</p>
    </div>
    
    <!-- Mensaje de finalización -->
    <div class="mb-lg" *ngIf="isLastStep">
      <div class="text-center">
        <h3 class="text-primary">¡Proceso Completado!</h3>
        <p>Has finalizado exitosamente el flujo para {{ currentProject?.name }}</p>
      </div>
    </div>
  </div>
  
  <!-- Navegación -->
  <div class="flow-navigation">
    <button 
      *ngIf="!isFirstStep" 
      class="btn btn-outline"
      (click)="goToPreviousStep()">
      {{ getPreviousButtonText() }}
    </button>
    
    <div *ngIf="isFirstStep"></div>
    
    <button 
      *ngIf="!isLastStep"
      class="btn btn-primary"
      (click)="handleNextClick()">
      {{ getButtonText() }}
    </button>
    
    <button 
      *ngIf="isLastStep"
      class="btn btn-primary"
      (click)="handleNextClick()">
      {{ getButtonText() }}
    </button>
  </div>
</div>
